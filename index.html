<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMatch</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
</head>


<body class="corps">

    <main class="contenu">

        <section id="p-decouvrir" class="page active">
            <h1 class="titre-logo">JobMatch</h1>

            <div class="carte" id="carte_offre">
                <div class="carte-image">
                    <i class="fa-solid fa-briefcase"></i>
                </div>

                <div class="carte-infos">
                    <h2 class="titre-carte">Développeur Front-End</h2>
                    <p class="entreprise">TechVision Corp.</p>
                    <p class="info"><strong>Lieu :</strong> Paris</p>
                    <p class="info"><strong>Salaire :</strong> 45k€</p>
                </div>
            </div>

            <div class="actions">
                <button class="bouton-carte bouton-rouge">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button class="bouton-carte bouton-bleu">
                    <i class="fa-solid fa-check"></i>
                </button>
            </div>
        </section>


        <section id="p-offres" class="page">
            <div class="entete-page">
                <h1 class="titre-page">Mes Offres</h1>
                <button onclick="allerA('p-formulaire')" class="bouton bouton-creation">
                    + Créer
                </button>
            </div>

            <div class="carte carte-offre" onclick="allerA('p-matchs')">
                <h3 class="titre-offre">Designer UX/UI</h3>
                <p class="sous-texte-offre">12 matchs en cours</p>
            </div>
        </section>


        <section id="p-matchs" class="page">
            <div class="entete-page">
                <h1 class="titre-page">Conversations</h1>
            </div>

            <div class="carte carte-conversation">
                <div class="avatar"></div>
                <div class="infos-conversation">
                    <h4 class="nom-entreprise">TechVision Corp.</h4>
                    <p class="dernier-message">C'est un match ! Discutons...</p>
                </div>
            </div>
        </section>


        <section id="p-profil" class="page">
            <div class="entete-profil">
                <div class="avatar-grand"></div>
                <h2 class="nom-profil">Jean Dupont</h2>
            </div>

            <div class="carte carte-profil">
                <p class="titre-section">Mes critères</p>
                <label class="ligne-checkbox">
                    <input type="checkbox" checked>
                    CDI uniquement
                </label>
            </div>
        </section>


        <section id="p-formulaire" class="page">
            <button onclick="allerA('p-offres')" class="bouton-retour">
                <i class="fa-solid fa-arrow-left"></i> Retour
            </button>

            <h1 class="titre-page">Nouvelle Offre</h1>
            <input type="text" placeholder="Titre du poste" class="champ-formulaire">
            <textarea placeholder="Missions..." rows="4" class="champ-formulaire"></textarea>

            <button onclick="allerA('p-offres')" class="bouton bouton-principal">
                Publier
            </button>
        </section>

    </main>


    <nav class="barre-nav">
        <button onclick="allerA('p-decouvrir')" class="onglet actif" id="n-decouvrir">
            <i class="fa-solid fa-clone nav-icon"></i>
            <span>Découvrir</span>
        </button>

        <button onclick="allerA('p-offres')" class="onglet" id="n-offres">
            <i class="fa-solid fa-briefcase nav-icon"></i>
            <span>Offres</span>
        </button>

        <button onclick="allerA('p-matchs')" class="onglet" id="n-matchs">
            <i class="fa-solid fa-comments nav-icon"></i>
            <span>Matchs</span>
        </button>

        <button onclick="allerA('p-profil')" class="onglet" id="n-profil">
            <i class="fa-solid fa-user nav-icon"></i>
            <span>Profil</span>
        </button>
    </nav>

</body>
