<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMatch</title>
    
    <link rel="icon" type="image/x-icon" href="assets/logo_tab.ico">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
</head>


<body class="corps">

    <main class="contenu">

        <div id="notification" class="notification">
            Content
        </div>

        <div id="choix-utilisateur">
            <select id="choix-utilisateur-select">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
            </select>
        </div>

        <section id="p-decouvrir" class="page active">
            <div class="logo-container">
                <div class="logo-background">
                    <img class="logo" src="assets/logo.png" alt="Logo JobMatch">
                </div>
                <h1 class="titre-logo">JobMatch</h1>
            </div>

            <div class="carte hidden" id="carte-offre">
                <div class="carte-image">
                    <i class="fa-solid fa-briefcase"></i>
                </div>

                <div class="carte-infos">
                    <h2 id="titre-carte" class="titre-carte">Développeur Front-End</h2>
                    <p id="entreprise-carte" class="entreprise">TechVision Corp.</p>
                    <p class="info"><strong>Lieu :</strong> Paris</p>
                    <p class="info"><strong>Salaire :</strong> 45k€</p>
                </div>
            </div>

            <div id="plus-de-proposition" class="hidden">Plus de proposition disponibles ;-;</div>

            <!--
            <div class="actions">
                <button class="bouton-carte bouton-rouge">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button class="bouton-carte bouton-bleu">
                    <i class="fa-solid fa-check"></i>
                </button>
            </div>
            -->
        </section>


        <section id="p-offres" class="page">
            <div class="entete-page">
                <h1 class="titre-page">Mes Offres</h1>
                <button onclick="allerA('p-formulaire')" class="bouton bouton-creation">
                    + Créer
                </button>
            </div>

            <div class="liste-offres" id="liste-mes-offres">
                <div class="carte carte-offre hidden" id="template-offre" onclick="allerA('p-matchs')">
                    <div class="infos-offre">
                        <h3 class="titre-offre">Designer UX/UI</h3>
                        <p class="sous-texte-offre">12 matchs en cours</p>
                    </div>
                    <div class="actions-offre">
                        <button class="bouton-edit hidden" onclick="event.stopPropagation()">🖌️</button>
                        <button class="bouton-supprimer hidden" onclick="event.stopPropagation()">🗑️</button>
                    </div>
                </div>
                
            </div>

        </section>


        <section id="p-matchs" class="page">
            <div class="entete-page">
                <h1 class="titre-page">Conversations</h1>
            </div>

            <div class="carte carte-conversation">
                <img class="avatar" src="" alt="Photo de profil">
                <div class="infos-conversation">
                    <h4 class="nom-entreprise">TechVision Corp.</h4>
                    <p class="dernier-message">C'est un match ! Discutons...</p>
                </div>
            </div>
        </section>


        <section id="p-profil" class="page">
            <div class="entete-profil">
                <img class="avatar-grand photo-profil" src="" alt="Photo de profil">
                <h2 class="nom-profil">Jean Dupont</h2>
            </div>

            <div class="carte carte-profil">
                <p class="titre-section">Mes critères</p>
                <label class="ligne-checkbox">
                    <input type="checkbox" checked>
                    CDI uniquement
                </label>
            </div>
        </section>


        <section id="p-formulaire" class="page">
            <button onclick="allerA('p-offres')" class="bouton-retour">
                <i class="fa-solid fa-arrow-left"></i> Retour
            </button>

            <h1 class="titre-page">Nouvelle Offre</h1>
            <input id="input-titre-offre" type="text" placeholder="Titre du poste" class="champ-formulaire">
            <textarea placeholder="Missions..." rows="4" class="champ-formulaire"></textarea>

            <button class="bouton bouton-principal" id="bouton-ajouter-offre">
                Publier
            </button>
        </section>

    </main>


    <nav class="barre-nav">
        <button onclick="allerA('p-decouvrir')" class="onglet actif" id="n-decouvrir">
            <i class="fa-solid fa-clone nav-icon"></i>
            <span>Découvrir</span>
        </button>

        <button onclick="allerA('p-offres')" class="onglet" id="n-offres">
            <i class="fa-solid fa-briefcase nav-icon"></i>
            <span>Offres</span>
        </button>

        <button onclick="allerA('p-matchs')" class="onglet" id="n-matchs">
            <i class="fa-solid fa-comments nav-icon"></i>
            <span>Matchs</span>
        </button>

        <button onclick="allerA('p-profil')" class="onglet" id="n-profil">
            <i class="fa-solid fa-user nav-icon"></i>
            <span>Profil</span>
        </button>
    </nav>

</body>
